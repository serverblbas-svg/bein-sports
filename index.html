<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BEIN SPORTS UHD - پەخشی ڕاستەوخۆ (TS)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: #fff;
        }
        #mainContainer {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0a0a0a;
        }
        #sidebar {
            width: 280px;
            min-width: 280px;
            background: #121212;
            border-left: 1px solid #2a2a2a;
            overflow-y: auto;
            padding: 10px 0;
            height: 100vh;
            order: 2;
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 10px; }
        #sidebar::-webkit-scrollbar-track { background: #1a1a1a; }

        .channel-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #ccc;
            border-right: 3px solid transparent;
        }
        .channel-item:hover {
            background: #1e1e1e;
            color: #fff;
        }
        .channel-item.active {
            background: #1e1e1e;
            border-right-color: #ffcc00;
            color: #ffcc00;
            font-weight: 600;
        }
        .channel-number {
            color: #ffcc00;
            font-weight: bold;
            font-size: 12px;
            min-width: 24px;
        }
        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-badge {
            background: #ffcc00;
            color: #000;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 700;
            margin-right: auto;
        }

        #videoContainer {
            flex: 1;
            height: 100vh;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #brandName {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 8px;
            border-right: 3px solid #ffcc00;
        }

        #unmuteBtn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #ffcc00, #f5a623);
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 50px;
            z-index: 10;
            font-size: 16px;
            color: #1a1a1a;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.3);
            transition: all 0.3s ease;
            display: none;
        }
        #unmuteBtn:hover { transform: scale(1.05); }

        #loading {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
            gap: 16px;
            color: #ffcc00;
            font-size: 18px;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #errorMsg {
            display: none;
            color: #ff6b6b;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
        #errorMsg:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            #mainContainer { flex-direction: column; }
            #sidebar {
                width: 100%;
                min-width: unset;
                height: 35vh;
                order: 1;
                border-left: none;
                border-bottom: 1px solid #2a2a2a;
            }
            #videoContainer {
                height: 65vh;
                width: 100%;
                order: 2;
            }
            #brandName {
                font-size: 16px;
                top: 10px;
                right: 14px;
                padding: 4px 12px;
            }
            #unmuteBtn {
                bottom: 16px;
                right: 16px;
                padding: 10px 20px;
                font-size: 14px;
            }
            .channel-item { padding: 10px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="mainContainer">
    <div id="sidebar"></div>
    <div id="videoContainer">
        <div id="brandName">BEIN SPORTS UHD</div>
        <video id="videoPlayer" playsinline autoplay muted></video>
        <button id="unmuteBtn" onclick="unmuteVideo()">🔊 کلیک بکە بۆ دەنگ</button>
        <div id="loading">
            <div class="spinner"></div>
            <span>⏳ بارکردنی پەخش...</span>
            <div id="errorMsg"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🐱 CAT SHADOW ENGINE - BEIN SPORTS UHD (TS Streams)
// ============================================================

// 📺 لیستی کەناڵەکان - هەموو لینکەکان بە .ts کۆتاییان دێت
const CHANNELS = [
    { id: 1, name: 'BEIN SPORTS 1 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798772&extension=ts' },
    { id: 2, name: 'BEIN SPORTS 2 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798773&extension=ts' },
    { id: 3, name: 'BEIN SPORTS 3 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798788&extension=ts' },
    { id: 4, name: 'BEIN SPORTS 4 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798789&extension=ts' },
    { id: 5, name: 'BEIN SPORTS 5 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798790&extension=ts' },
    { id: 6, name: 'BEIN SPORTS 6 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798791&extension=ts' },
    { id: 7, name: 'BEIN SPORTS 7 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798792&extension=ts' },
    { id: 8, name: 'BEIN SPORTS 8 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798793&extension=ts' },
    { id: 9, name: 'BEIN SPORTS 9 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798794&extension=ts' }
];

// ============================================================
// 🎯 دۆمەنەکان
// ============================================================
const video = document.getElementById('videoPlayer');
const loading = document.getElementById('loading');
const errorMsg = document.getElementById('errorMsg');
const sidebar = document.getElementById('sidebar');
const unmuteBtn = document.getElementById('unmuteBtn');
let hlsInstance = null;
let currentChannel = null;
let retryCount = 0;
const MAX_RETRIES = 3;

// ============================================================
// 📋 دروستکردنی لیستی کەناڵەکان
// ============================================================
function renderChannels() {
    sidebar.innerHTML = '';
    CHANNELS.forEach((ch, index) => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.dataset.index = index;
        div.innerHTML = `
            <span class="channel-number">${String(index + 1).padStart(2, '0')}</span>
            <span class="channel-name">${ch.name}</span>
            <span class="channel-badge">TS</span>
        `;
        div.addEventListener('click', () => playChannel(index));
        sidebar.appendChild(div);
    });
}

// ============================================================
// ▶️ پەخشکردنی کەناڵ (بۆ TS)
// ============================================================
function playChannel(index) {
    const channel = CHANNELS[index];
    if (!channel) return;
    
    document.querySelectorAll('.channel-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
    });

    currentChannel = channel;
    retryCount = 0;
    
    loading.style.display = 'flex';
    errorMsg.style.display = 'none';
    unmuteBtn.style.display = 'none';

    // بۆ TS، پێویستە بە پرۆکسی یان ڕاستەوخۆ
    const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(channel.url);
    
    // هەوڵدان بە پرۆکسی
    loadStream(proxyUrl, channel.url);
}

// ============================================================
// 🔄 بارکردنی ستریم - پشتگیری TS
// ============================================================
function loadStream(proxyUrl, directUrl) {
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }

    // بۆ TS، یەکەم هەوڵ بە HLS
    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 600,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            xhrSetup: function(xhr, url) {
                xhr.withCredentials = false;
                try {
                    xhr.setRequestHeader('Origin', window.location.origin);
                    xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                } catch(e) {}
            }
        });

        hlsInstance.loadSource(proxyUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().then(() => {
                loading.style.display = 'none';
                unmuteBtn.style.display = 'block';
            }).catch(() => {
                // ئەگەر HLS کار نەکرد، ڕاستەوخۆ ڤیدیۆ بەکاربهێنە
                tryDirectPlay(directUrl);
            });
        });

        hlsInstance.on(Hls.Events.ERROR, function(event, data) {
            console.error('HLS Error:', data);
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < MAX_RETRIES) {
                    retryCount++;
                    setTimeout(() => {
                        if (hlsInstance) hlsInstance.startLoad();
                    }, 2000 * retryCount);
                } else {
                    // HLS سەرنەکەوت، ڕاستەوخۆ ڤیدیۆ بەکاربهێنە
                    tryDirectPlay(directUrl);
                }
            }
        });

        // ئەگەر HLS نەیتوانی مانگیفێست بدۆزێتەوە، دوای ٥ چرکە ڕاستەوخۆ هەوڵبدە
        setTimeout(() => {
            if (loading.style.display !== 'none') {
                tryDirectPlay(directUrl);
            }
        }, 5000);

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari
        video.src = directUrl;
        video.addEventListener('loadedmetadata', function() {
            video.play().then(() => {
                loading.style.display = 'none';
                unmuteBtn.style.display = 'block';
            });
        });
    } else {
        // ئەگەر هیچ شتێک کار نەکرد، ڕاستەوخۆ ڤیدیۆ
        tryDirectPlay(directUrl);
    }
}

// ============================================================
// 🎯 پەخشکردنی ڕاستەوخۆ (بۆ TS)
// ============================================================
function tryDirectPlay(url) {
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }
    
    // بۆ TS، دەتوانین بە شێوەی ئاسایی ڤیدیۆ پەخش بکەین
    video.src = url;
    video.load();
    
    video.play().then(() => {
        loading.style.display = 'none';
        unmuteBtn.style.display = 'block';
    }).catch((err) => {
        console.error('Direct play error:', err);
        showError('ناتوانرێت پەخش بکرێت - هەوڵدانەوە');
    });
}

// ============================================================
// ⚠️ هەڵە
// ============================================================
function showError(msg) {
    errorMsg.textContent = '❌ ' + msg + ' — کلیک بکە بۆ هەوڵدانەوە';
    errorMsg.style.display = 'block';
    errorMsg.onclick = function() {
        if (currentChannel) {
            const idx = CHANNELS.indexOf(currentChannel);
            if (idx > -1) playChannel(idx);
        }
    };
    loading.style.display = 'flex';
}

// ============================================================
// 🔇 دەنگ کردنەوە
// ============================================================
function unmuteVideo() {
    video.muted = false;
    video.volume = 1.0;
    unmuteBtn.style.display = 'none';
}

video.addEventListener('click', function() {
    if (video.muted) unmuteVideo();
});

// ئەگەر ڤیدیۆ وەستا، دووبارە هەوڵبدەرەوە
video.addEventListener('stalled', function() {
    if (currentChannel) {
        const idx = CHANNELS.indexOf(currentChannel);
        if (idx > -1) {
            setTimeout(() => playChannel(idx), 3000);
        }
    }
});

// ============================================================
// 🚀 دەستپێکردن
// ============================================================
renderChannels();
playChannel(0);

console.log('🐱 BEIN SPORTS UHD - CAT Shadow Engine (TS Streams)');
</script>
</body>
</html>
