<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI SPORTS HD - پەخشی ڕاستەوخۆ</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #videoPlayer { 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain; 
            background: #000;
        }
        #brandName { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            color: #fff; 
            font-size: 28px; 
            font-weight: bold; 
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 10px;
            border-right: 4px solid #ffcc00;
        }
        #unmuteBtn { 
            position: absolute; 
            bottom: 40px; 
            right: 40px; 
            padding: 16px 30px; 
            background: linear-gradient(135deg, #ffcc00, #f5a623);
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 50px; 
            z-index: 10; 
            font-size: 18px;
            color: #1a1a1a;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.4);
        }
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; color: #ffcc00; font-size: 24px;
            flex-direction: column; gap: 20px;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid #1a1a1a;
            border-top: 5px solid #ffcc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>⏳ پەیوەندیکردن بە پەخش...</span>
    </div>

    <div id="brandName">SPI SPORTS HD</div>
    <video id="videoPlayer" playsinline autoplay muted></video>
    <button id="unmuteBtn" onclick="unmuteVideo()">🔊 کلیک بکە بۆ دەنگ</button>

    <script>
        const video = document.getElementById('videoPlayer');
        const loading = document.getElementById('loading');
        const videoSrc = 'https://connect.bein.com/live/75';

        if (Hls.isSupported()) {
            const hls = new Hls({
                xhrSetup: function(xhr, url) {
                    // زیادکردنی هیدەری پێویست بۆ ئەوەی وێبگەڕ قبوڵی بکات
                    xhr.withCredentials = false;
                }
            });
            
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().then(() => {
                    loading.style.display = 'none';
                }).catch(() => {
                    loading.style.display = 'none';
                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error("HLS Error:", data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hls.recoverMediaError();
                            break;
                        default:
                            loading.innerHTML = '<span style="color:#ff4444;">❌ کێشەی CORS یان قەدەغەکردنی پەخش لە وێبگەڕدا</span>';
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play().then(() => {
                    loading.style.display = 'none';
                });
            });
        }

        function unmuteVideo() {
            video.muted = false;
            video.volume = 1.0;
            document.getElementById('unmuteBtn').style.display = 'none';
        }

        video.addEventListener('click', function() {
            if (video.muted) unmuteVideo();
        });
    </script>
</body>
</html>
