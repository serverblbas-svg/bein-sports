<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BEIN SPORTS UHD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: #fff;
        }
        #mainContainer {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0a0a0a;
        }
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: #121212;
            border-left: 1px solid #2a2a2a;
            overflow-y: auto;
            padding: 8px 0;
            height: 100vh;
            order: 2;
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 10px; }
        #sidebar::-webkit-scrollbar-track { background: #1a1a1a; }

        .channel-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #ccc;
            border-right: 3px solid transparent;
        }
        .channel-item:hover {
            background: #1e1e1e;
            color: #fff;
        }
        .channel-item.active {
            background: #1e1e1e;
            border-right-color: #ffcc00;
            color: #ffcc00;
            font-weight: 600;
        }
        .channel-number {
            color: #ffcc00;
            font-weight: bold;
            font-size: 11px;
            min-width: 22px;
        }
        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-badge {
            background: #ffcc00;
            color: #000;
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 700;
            margin-right: auto;
        }
        .channel-status {
            font-size: 10px;
            color: #666;
            margin-right: 6px;
        }
        .channel-status.on { color: #4caf50; }
        .channel-status.off { color: #ff6b6b; }

        #videoContainer {
            flex: 1;
            height: 100vh;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #brandName {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 8px;
            border-right: 3px solid #ffcc00;
        }

        #unmuteBtn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffcc00, #f5a623);
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 50px;
            z-index: 10;
            font-size: 15px;
            color: #1a1a1a;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.3);
            transition: all 0.3s ease;
            display: none;
        }
        #unmuteBtn:hover { transform: scale(1.05); }

        #loading {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
            gap: 16px;
            color: #ffcc00;
            font-size: 17px;
        }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #errorMsg {
            display: none;
            color: #ff6b6b;
            font-size: 15px;
            text-align: center;
            padding: 16px;
            cursor: pointer;
            max-width: 80%;
            line-height: 1.6;
        }
        #errorMsg:hover { text-decoration: underline; }

        #statusBar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            z-index: 15;
            border: 1px solid #2a2a2a;
            display: none;
            text-align: center;
            max-width: 90%;
        }
        #statusBar .highlight { color: #ffcc00; }

        @media (max-width: 768px) {
            #mainContainer { flex-direction: column; }
            #sidebar {
                width: 100%;
                min-width: unset;
                height: 30vh;
                order: 1;
                border-left: none;
                border-bottom: 1px solid #2a2a2a;
            }
            #videoContainer {
                height: 70vh;
                width: 100%;
                order: 2;
            }
            #brandName {
                font-size: 14px;
                top: 10px;
                right: 14px;
                padding: 4px 12px;
            }
            #unmuteBtn {
                bottom: 14px;
                right: 14px;
                padding: 10px 18px;
                font-size: 13px;
            }
            .channel-item { padding: 8px 12px; font-size: 12px; }
            #statusBar { bottom: 60px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<div id="mainContainer">
    <div id="sidebar"></div>
    <div id="videoContainer">
        <div id="brandName">BEIN SPORTS UHD</div>
        <video id="videoPlayer" playsinline autoplay muted></video>
        <button id="unmuteBtn" onclick="unmuteVideo()">🔊 کلیک بکە بۆ دەنگ</button>
        <div id="statusBar">⏳ <span class="highlight">بارکردن...</span></div>
        <div id="loading">
            <div class="spinner"></div>
            <span>⏳ پەیوەندیکردن...</span>
            <div id="errorMsg"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🐱 CAT SHADOW ENGINE - دیاریکردنی کێشە
// ============================================================

const CHANNELS = [
    { id: 1, name: 'BEIN SPORTS 1 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798772&extension=ts' },
    { id: 2, name: 'BEIN SPORTS 2 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798773&extension=ts' },
    { id: 3, name: 'BEIN SPORTS 3 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798788&extension=ts' },
    { id: 4, name: 'BEIN SPORTS 4 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798789&extension=ts' },
    { id: 5, name: 'BEIN SPORTS 5 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798790&extension=ts' },
    { id: 6, name: 'BEIN SPORTS 6 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798791&extension=ts' },
    { id: 7, name: 'BEIN SPORTS 7 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798792&extension=ts' },
    { id: 8, name: 'BEIN SPORTS 8 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798793&extension=ts' },
    { id: 9, name: 'BEIN SPORTS 9 UHD', url: 'https://main.light-ott.net/play/live.php?mac=A0:BB:3E:02:40:2B&stream=798794&extension=ts' }
];

const video = document.getElementById('videoPlayer');
const loading = document.getElementById('loading');
const errorMsg = document.getElementById('errorMsg');
const statusBar = document.getElementById('statusBar');
const sidebar = document.getElementById('sidebar');
const unmuteBtn = document.getElementById('unmuteBtn');
let hlsInstance = null;
let currentIndex = 0;
let isPlaying = false;

// ============================================================
// 📋 لیستی کەناڵەکان
// ============================================================
function renderChannels() {
    sidebar.innerHTML = '';
    CHANNELS.forEach((ch, index) => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.dataset.index = index;
        div.innerHTML = `
            <span class="channel-number">${String(index + 1).padStart(2, '0')}</span>
            <span class="channel-name">${ch.name}</span>
            <span class="channel-badge">UHD</span>
            <span class="channel-status" id="status_${index}">⏳</span>
        `;
        div.addEventListener('click', () => playChannel(index));
        sidebar.appendChild(div);
    });
}

// ============================================================
// 📊 نوێکردنەوەی دۆخی کەناڵ
// ============================================================
function setChannelStatus(index, status) {
    const el = document.getElementById('status_' + index);
    if (!el) return;
    el.className = 'channel-status ' + status;
    el.textContent = status === 'on' ? '✅' : status === 'off' ? '❌' : '⏳';
}

// ============================================================
// 📝 نوێکردنەوەی ستاتوس بار
// ============================================================
function setStatus(text, isError = false) {
    statusBar.style.display = 'block';
    statusBar.innerHTML = text;
    if (isError) {
        statusBar.style.borderColor = '#ff6b6b';
        statusBar.style.color = '#ff6b6b';
    } else {
        statusBar.style.borderColor = '#2a2a2a';
        statusBar.style.color = '#aaa';
    }
}

// ============================================================
// ▶️ پەخشکردن
// ============================================================
function playChannel(index) {
    const channel = CHANNELS[index];
    if (!channel) return;
    
    document.querySelectorAll('.channel-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
    });

    currentIndex = index;
    isPlaying = false;
    
    loading.style.display = 'flex';
    errorMsg.style.display = 'none';
    unmuteBtn.style.display = 'none';
    statusBar.style.display = 'block';
    setStatus('⏳ پەیوەندیکردن بە ' + channel.name);

    // ڕاگیرکردنی HLS کۆن
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }

    // تاقیکردنەوەی پەخش
    testStream(channel.url, index);
}

// ============================================================
// 🔍 تاقیکردنەوەی ستریم
// ============================================================
function testStream(url, index) {
    setStatus('📡 تاقیکردنەوەی پەخش...');
    setChannelStatus(index, 'loading');

    // یەکەم: تاقیکردنەوەی بە HLS
    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            maxBufferLength: 30,
            xhrSetup: function(xhr, url) {
                xhr.withCredentials = false;
                try {
                    xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                } catch(e) {}
            }
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            setStatus('✅ مانگیفێست بارکرا، دەستپێکردنی پەخش...');
            video.play().then(() => {
                isPlaying = true;
                loading.style.display = 'none';
                unmuteBtn.style.display = 'block';
                setStatus('▶️ پەخشی ' + CHANNELS[index].name + ' — <span class="highlight">زیندوو</span>');
                setChannelStatus(index, 'on');
            }).catch((err) => {
                setStatus('⚠️ پەخش نەکرا: ' + err.message, true);
                tryDirectPlay(url, index);
            });
        });

        hlsInstance.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                setStatus('⚠️ هەڵەی HLS: ' + (data.details || 'نەزانراو'), true);
                tryDirectPlay(url, index);
            }
        });

        // دوای ٥ چرکە ئەگەر HLS کار نەکرد
        setTimeout(() => {
            if (loading.style.display !== 'none') {
                setStatus('⏳ HLS وەڵامی نەدایەوە، هەوڵدان بە شێوەی تر...', true);
                tryDirectPlay(url, index);
            }
        }, 5000);

    } else {
        tryDirectPlay(url, index);
    }
}

// ============================================================
// 📺 پەخش بە ڤیدیۆی ئاسایی
// ============================================================
function tryDirectPlay(url, index) {
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }

    setStatus('📺 هەوڵدان بە پەخشی ڕاستەوخۆ...');

    video.src = url;
    video.load();

    video.play().then(() => {
        isPlaying = true;
        loading.style.display = 'none';
        unmuteBtn.style.display = 'block';
        setStatus('▶️ پەخشی ' + CHANNELS[index].name + ' — <span class="highlight">زیندوو</span>');
        setChannelStatus(index, 'on');
    }).catch((err) => {
        setStatus('❌ پەخش سەرنەکەوت: ' + err.message, true);
        setChannelStatus(index, 'off');
        showError('پەخش نەکرا - ' + err.message);
    });
}

// ============================================================
// ⚠️ هەڵە
// ============================================================
function showError(msg) {
    errorMsg.textContent = '❌ ' + msg + ' — کلیک بکە بۆ هەوڵدانەوە';
    errorMsg.style.display = 'block';
    errorMsg.onclick = function() {
        loading.style.display = 'flex';
        errorMsg.style.display = 'none';
        playChannel(currentIndex);
    };
    loading.style.display = 'flex';
}

// ============================================================
// 🔇 دەنگ
// ============================================================
function unmuteVideo() {
    video.muted = false;
    video.volume = 1.0;
    unmuteBtn.style.display = 'none';
}

video.addEventListener('click', function() {
    if (video.muted) unmuteVideo();
});

// ============================================================
// 📊 دیاریکردنی کێشەکان
// ============================================================
function diagnose() {
    console.log('🔍 دیاریکردنی کێشە:');
    console.log('- HLS پشتگیری دەکات؟', Hls.isSupported());
    console.log('- ژمارەی کەناڵەکان:', CHANNELS.length);
    console.log('- دۆخی ڤیدیۆ:', video.readyState);
    console.log('- دەنگ بەمۆ?:', video.muted);
    console.log('- URLی ئێستا:', video.src);
}

// ============================================================
// 🚀 دەستپێکردن
// ============================================================
renderChannels();
playChannel(0);

// دوای ٣ چرکە دیاریکردن بکە
setTimeout(diagnose, 3000);

console.log('🐱 BEIN SPORTS UHD - شێوازی دیاریکردن');
</script>
</body>
</html>
